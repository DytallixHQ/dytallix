name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check source distribution
        run: python3 scripts/check_source_distribution.py
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Evidence helper contract
        run: |
          cargo test --locked --all-targets --features pqc-real
          cargo run --locked --features pqc-real --bin pqc_evidence -- "$RUNNER_TEMP/pqc-evidence"
          cargo build --locked --bin pqc_evidence
          if target/debug/pqc_evidence; then
            echo 'Evidence helper unexpectedly succeeded without pqc-real' >&2
            exit 1
          fi
