name: Rust Release Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  adaptive-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify adaptive emission reference
        run: |
          python3 scripts/adaptive_reference.py
          python3 scripts/check_module_boundaries.py
          cargo fmt --all -- --check
          cargo test --locked -p dytallix-adaptive-emission
          cargo test --locked --release -p dytallix-adaptive-emission
          cargo clippy --locked -p dytallix-adaptive-emission --all-targets -- -D warnings
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev
      - name: Check module boundaries
        run: |
          python3 scripts/check_module_boundaries.py
          python3 -B -m unittest discover -s scripts -p test_module_boundaries.py
      - name: Record build inputs
        run: |
          rustc -Vv
          cargo -V
          sha256sum Cargo.lock
          cargo metadata --locked --format-version 1 > dependency-inventory.json
      - name: Verify adaptive command journal
        run: cargo test --locked -p dytallix-storage
      - name: Verify genesis arithmetic and allocation import
        run: |
          cargo test --locked -p dytallix-node --lib genesis::tests
          cargo test --locked -p dytallix-node --lib storage::genesis_import_tests
          cargo test --locked -p dytallix-node --lib genesis_integration::tests::explicit_vesting_time
          cargo test --locked -p dytallix-node --lib genesis_integration::tests::direct_account_creation
          cargo test --locked -p dytallix-node --example genesis_usage
      - name: Verify genesis funding and restart
        run: |
          cargo test --locked -p dytallix-fast-node --lib genesis::tests
          cargo test --locked -p dytallix-node --lib runtime::genesis_funding_tests
      - name: Verify transaction settlement
        run: |
          cargo test --locked -p dytallix-fast-node --lib settlement::tests
          cargo test --locked -p dytallix-fast-node --lib production_control
          cargo test --locked -p dytallix-fast-node --lib execution::tests
          cargo test --locked -p dytallix-fast-node --test gas_accounting_unit --test gas_execution_integration --test gas_api
      - name: Verify configuration and signature policy
        run: |
          cargo test --locked -p dytallix-node --lib config::tests
          cargo test --locked -p dytallix-signature-policy --lib
          cargo test --locked -p dytallix-node --lib secrets::
          cargo test --locked -p dytallix-node --test secrets_integration_test
      - name: Verify storage sessions and audit staging
        run: |
          cargo test --locked -p dytallix-contracts --lib storage_optimizer
          cargo test --locked -p dytallix-node --lib consensus::audit_trail
          cargo test --locked -p dytallix-node --lib consensus::performance_optimizer
          cargo test --locked -p dytallix-node --lib consensus::compliance_api
      - name: Verify review queue and isolated storage
        run: |
          cargo test --locked -p dytallix-node --lib consensus::high_risk_queue
          cargo test --locked -p dytallix-node --lib consensus::review_api
          cargo test --locked -p dytallix-node --lib storage::tests
          cargo test --locked -p dytallix-node --lib consensus::transaction_validation_tests
          cargo test --locked -p dytallix-node --test simple_contract_integration_test --test wasm_integration_test
      - name: Verify core HTTP, signatures, and registry integration
        run: cargo test --locked -p dytallix-node --test health_check_test --test circuit_breaker_test --test connectivity_test --test signature_verification_integration_test --test block_signing_tests --test oracle_registry_comprehensive_test --example health_check_demo --example circuit_breaker_demo
      - name: Build selected release
        run: cargo build --locked --release -p dytallix-fast-node --bin dytallix-fast-node
      - name: Existing-key startup contract
        run: |
          python3 scripts/check_existing_key_startup.py target/release/dytallix-fast-node
          python3 scripts/check_genesis_startup.py target/release/dytallix-fast-node
      - name: Build registry test fixture
        run: |
          rustup target add wasm32-unknown-unknown
          python3 scripts/build_registry_fixture.py
      - name: Workspace tests with default features
        run: cargo test --locked --workspace --all-targets
      - name: Embedded PQC evidence checks
        run: |
          cargo test --locked -p dytallix-pqc --bin pqc_evidence --features pqc-real
          cargo run --locked -p dytallix-pqc --features pqc-real --bin pqc_evidence -- "$RUNNER_TEMP/pqc-evidence"
      - name: Reject a disabled evidence backend
        run: |
          cargo build --locked -p dytallix-pqc --bin pqc_evidence
          if target/debug/pqc_evidence; then
            echo 'Evidence helper unexpectedly succeeded without pqc-real' >&2
            exit 1
          fi
  legacy-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev
      - name: Check separate legacy backend
        run: cargo check --locked -p dytallix-fast-node --all-targets --no-default-features --features pqc-real,metrics,oracle,contracts
      - name: Test legacy signature integration
        run: cargo test --locked -p dytallix-fast-node --no-default-features --features pqc-real,metrics,oracle,contracts --test pqc_signature_integration_test --test pqc_tamper_verify
