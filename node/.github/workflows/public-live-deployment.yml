name: Public Live Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-live-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Verify live public deployment contract
        run: python3 scripts/check_live_public_deployment.py
