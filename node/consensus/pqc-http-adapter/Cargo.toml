[package]
name = "dytallix-pqc-http-adapter"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately separate from the node workspace and its feature unification.
[workspace]

[dependencies]
dytallix-release-runtime = { path = "../../crates/release-runtime" }
base64 = "=0.22.1"
bytes = "=1.11.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
libc = "=0.2.184"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.51.0", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }

[profile.release]
opt-level = 2
codegen-units = 1
lto = false
strip = false
panic = "abort"
