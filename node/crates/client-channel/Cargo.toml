[package]
name = "dytallix-client-channel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The client channel (E04 gap 19, docs/architecture/client-channel-v1.md).
# Sans-IO: callers read and write the bytes, so no runtime is linked here.
[dependencies]
fips203 = { version = "=0.4.3", default-features = false, features = ["default-rng", "ml-kem-768"] }
fips204 = { version = "0.4", default-features = false, features = ["default-rng", "ml-dsa-65"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = "1"
