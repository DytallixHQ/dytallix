[package]
name = "dytallix-runtime-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
dytallix-protocol-types = { path = "../protocol-types" }
thiserror = "1"
tracing = "0.1"
fips204 = { version = "0.4", optional = true, default-features = false, features = ["default-rng", "ml-dsa-65"] }
rand_core = "0.6"
blake3 = "1.5"
once_cell = "1"

[features]
default = []
pqc-consensus = ["pqc-fips204"]
pqc-fips204 = ["dep:fips204"]
