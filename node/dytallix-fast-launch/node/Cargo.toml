[package]
name = "dytallix-fast-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Dytallix consensus application"

[dependencies]
dytallix-adaptive-emission = { path = "../../crates/adaptive-emission" }
dytallix-protocol-types = { path = "../../crates/protocol-types" }
dytallix-runtime-crypto = { path = "../../crates/runtime-crypto", default-features = false }
dytallix-storage = { path = "../../crates/storage", default-features = false }
dytallix-release-runtime = { path = "../../crates/release-runtime" }
anyhow = "1"
libc = "=0.2.184"
blake3 = "1.5"
bincode = "1"
bytes = "1"
hex = "0.4"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bech32 = "0.11"
fips204 = { version = "0.4", optional = true, default-features = false, features = ["default-rng", "ml-dsa-65"] }
sha3 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
log = "0.4" # Snapshot and restore warnings
jmt = { version = "=0.12.0", default-features = false, features = ["std"] }
borsh = { version = "=1.8.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["pqc-consensus"]
# The selected mainnet consensus application.
pqc-consensus = ["pqc-fips204", "dytallix-storage/pqc-consensus", "dytallix-runtime-crypto/pqc-consensus"]
# Pure Rust FIPS 204 (ML-DSA).
pqc-fips204 = ["fips204", "dytallix-runtime-crypto/pqc-fips204"]
# Explicit local runner API for returned helper observations. No authority bypass.
helper-qualification = []
# Test application for the process tests (E04 gap 11, M-b); never a release.
# It accepts the historical snapshot root verifier, marks every response so
# the production bridge refuses it, and reports startup errors on stderr.
test-snapshot-verifier = []
# A production build (production activation v1): only the production
# profiles, no development entry points. Never combined with test features.
production = ["pqc-consensus"]

[[bin]]
name = "dytallix-state-check"
path = "src/bin/state_check.rs"

[[bin]]
name = "dytallix-genesis-build"
path = "src/bin/genesis_build.rs"

[[bin]]
name = "dytallix-control"
path = "src/bin/control.rs"

[[bin]]
name = "helper-execution-qualification"
path = "src/bin/helper_execution_qualification.rs"
required-features = ["helper-qualification"]
