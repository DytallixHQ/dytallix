[package]
name = "dytallix-fast-node"
version = "0.1.0"
edition = "2021"
description = "Dytallix consensus application"

[dependencies]
dytallix-adaptive-emission = { path = "../../crates/adaptive-emission" }
dytallix-protocol-types = { path = "../../crates/protocol-types" }
dytallix-runtime-crypto = { path = "../../crates/runtime-crypto", default-features = false }
dytallix-storage = { path = "../../crates/storage", default-features = false }
dytallix-signature-policy = { path = "../../crates/signature-policy" }
dytallix-release-runtime = { path = "../../crates/release-runtime" }
dytallix-gas = { path = "../../crates/gas" }
anyhow = "1"
libc = "=0.2.184"
blake3 = "1.5"
bincode = "1"
bytes = "1"
cfg-if = "1"
hex = "0.4"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
dotenv = "0.15"
base64 = "0.22"
bech32 = "0.11"
fips204 = { version = "0.4", optional = true, default-features = false, features = ["default-rng", "ml-dsa-65"] }
sha3 = "0.10"
once_cell = "1.21"
async-trait = "0.1"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
# Removed interactive passphrase prompts; keystore no longer uses rpassword
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
colored = "2" # Added for Colorize trait usage
log = "0.4"    # Added for mempool eviction logging

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["pqc-consensus"]
# The selected mainnet consensus application.
pqc-consensus = ["pqc-fips204", "dytallix-storage/pqc-consensus", "dytallix-runtime-crypto/pqc-consensus"]
# Pure Rust FIPS 204 (ML-DSA).
pqc-fips204 = ["fips204", "dytallix-runtime-crypto/pqc-fips204"]
# Explicit local runner API for returned helper observations. No authority bypass.
helper-qualification = []

[[bin]]
name = "helper-execution-qualification"
path = "src/bin/helper_execution_qualification.rs"
required-features = ["helper-qualification"]
