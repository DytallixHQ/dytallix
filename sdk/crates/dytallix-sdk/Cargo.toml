[package]
name = "dytallix-sdk"
description = "SDK for building on the Dytallix PQC-native blockchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[example]]
name = "first-keypair"
path = "../../examples/first-keypair.rs"

[features]
default = ["compatibility"]
compatibility = ["dytallix-core/compatibility"]
# Loopback HTTP to a node on this machine; no TLS anywhere (E04 gap 19).
http-loopback = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
strict-local-mldsa65 = ["http-loopback", "dytallix-core/strict-mldsa65"]
# Comet JSON-RPC client for the consensus chain: the post-quantum client
# channel to a pinned endpoint, or plain HTTP to a loopback node.
comet-rpc = ["compatibility", "http-loopback", "dep:dytallix-client-channel"]
ordinary-http-only = ["compatibility", "http-loopback"]

[dependencies]
# Exact canonical source snapshot; verify with scripts/check_protocol_vendor.py.
dytallix-protocol-types = { path = "../../vendor/dytallix-protocol-types" }
dytallix-core = { path = "../dytallix-core", default-features = false }
# Exact node source snapshot, as protocol-types (E04 gap 19).
dytallix-client-channel = { path = "../../vendor/dytallix-client-channel", optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha3 = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
# Keystore encryption at rest (E04 gap 16).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
zeroize = "1"

[dev-dependencies]
anyhow = { workspace = true }
