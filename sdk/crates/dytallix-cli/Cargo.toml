[package]
name = "dytallix-cli"
description = "CLI for the Dytallix PQC-native blockchain testnet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "dytallix"
path = "src/main.rs"
required-features = ["comet-rpc"]

[[bin]]
name = "dytallix-ordinary-local"
path = "src/ordinary_local.rs"
required-features = ["local-cli"]

[features]
default = ["comet-rpc"]
# The consensus-chain CLI: Comet JSON-RPC over the post-quantum client
# channel, or plain HTTP to a loopback node. No TLS (E04 gap 19).
comet-rpc = ["dytallix-sdk/comet-rpc"]
local-cli = []
strict-local-mldsa65 = ["local-cli", "dytallix-sdk/strict-local-mldsa65", "dytallix-core/strict-mldsa65"]
ordinary-http-only = ["local-cli", "dytallix-sdk/ordinary-http-only"]

[dependencies]
dytallix-core = { path = "../dytallix-core", default-features = false }
dytallix-sdk = { path = "../dytallix-sdk", default-features = false }
tokio = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
# Recovery files (E04 gap 17).
base64 = { workspace = true }
# Keystore passphrases without echo (E04 gap 16).
rpassword = "7"
zeroize = "1"
# The loopback browser companion, `dytallix gateway` (E04 gap 19, C-d).
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
dytallix-client-channel = { path = "../../vendor/dytallix-client-channel" }
