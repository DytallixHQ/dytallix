[package]
name = "dytallix-cli"
description = "CLI for the Dytallix PQC-native blockchain testnet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "dytallix"
path = "src/main.rs"
required-features = ["comet-rpc"]

[[bin]]
name = "dytallix-ordinary-local"
path = "src/ordinary_local.rs"
required-features = ["local-cli"]

[[example]]
name = "deploy-contract"
path = "../../examples/deploy-contract.rs"
required-features = ["legacy-network"]

[features]
default = ["comet-rpc"]
# The consensus-chain CLI: Comet JSON-RPC over HTTP or HTTPS.
comet-rpc = ["dytallix-sdk/comet-rpc"]
# The legacy testnet REST commands, until that testnet retires (clients v1,
# decision 1).
legacy-network = ["comet-rpc", "dytallix-sdk/network", "dep:reqwest", "reqwest/default"]
local-cli = []
strict-local-mldsa65 = ["local-cli", "dytallix-sdk/strict-local-mldsa65", "dytallix-core/strict-mldsa65"]
ordinary-http-only = ["local-cli", "dytallix-sdk/ordinary-http-only"]

[dependencies]
dytallix-core = { path = "../dytallix-core", default-features = false }
dytallix-sdk = { path = "../dytallix-sdk", default-features = false }
tokio = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, optional = true }
sha2 = "0.10"
# Keystore passphrases without echo (E04 gap 16).
rpassword = "7"
zeroize = "1"

[dev-dependencies]
base64 = { workspace = true }
