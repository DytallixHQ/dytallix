[package]
name = "dytallix-core"
description = "Cryptographic primitives for the Dytallix PQC-native blockchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["compatibility"]
compatibility = ["dep:pqcrypto-sphincsplus", "dep:pqcrypto-traits", "fips204/default", "fips205"]
# FIPS 205 SLH-DSA-SHAKE-192s account keys: the lattice-break fallback.
# Development networks only; the node refuses it on mainnet.
fips205 = ["dep:fips205"]
strict-mldsa65 = []

[dependencies]
pqcrypto-sphincsplus = { workspace = true, optional = true }
pqcrypto-traits = { workspace = true, optional = true }
fips204 = { workspace = true }
fips205 = { workspace = true, optional = true }
blake3 = { workspace = true }
bech32 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
