[workspace]
resolver = "2"
members = [
    "crates/dytallix-core",
    "crates/dytallix-sdk",
    "crates/dytallix-cli",
    "crates/ordinary-browser",
    "vendor/dytallix-protocol-types",
    "vendor/dytallix-client-channel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DytallixHQ"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DytallixHQ/dytallix"
homepage = "https://dytallix.com"
documentation = "https://github.com/DytallixHQ/dytallix/tree/main/sdk/docs"

[workspace.dependencies]
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }
blake3 = "1.5"
bech32 = "0.11"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# HTTP/1 only; hyper has no TLS (E04 gap 19). The CLI adds the server for
# its loopback browser companion.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha3 = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
colored = "2"
thiserror = "1"
anyhow = "1"
tokio-test = "0.4"

# Argon2id at the keystore's parameters is slow unoptimized; build only the
# KDF optimized in development and test builds (E04 gap 16).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
