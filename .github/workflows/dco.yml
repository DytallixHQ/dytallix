name: DCO

# Outside contributions are signed off under the Developer Certificate of
# Origin (P01, 5 October 2026; CONTRIBUTING.md and DCO). They come from
# forks; a pull request from a branch of this repository, which only people
# with write access can push, is not checked. (author_association is not
# used: a private organization member appears there as a contributor.)
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: DCO sign-off
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 release/repository.py check-dco "$BASE" "$HEAD"
