name: Host install

# Host setup v1, step H4 (E05; node/docs/architecture/host-setup-v1.md): a
# fresh release build, a throwaway staging chain built end to end from it
# (key step, genesis, release manifest, 3-of-5 root signatures, host files,
# bundles), and the validator's bundle installed with its install.sh on an
# Ubuntu 24.04 runner, started under systemd, AppArmor and nftables, verified,
# then stopped and started (a lone validator must rejoin), and wiped. That
# chain uses R01 to R06's rehearsal timing profile (T1b), so the shortened
# timings build, pass the host checks and run on every change; the staging
# network uses the ci profile. Invented records and throwaway keys only.
on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'release/**'
      - 'launch/E05_VALUES.json'
      - 'launch/genesis/**'
      - 'launch/hosts/**'
      - 'launch/simulations/TIMINGS.json'
      - '!**/*.md'
      - '.github/workflows/host-install.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'release/**'
      - 'launch/E05_VALUES.json'
      - 'launch/genesis/**'
      - 'launch/hosts/**'
      - 'launch/simulations/TIMINGS.json'
      - '!**/*.md'
      - '.github/workflows/host-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Staging bundle install (H4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release set depends only on these blobs: node/ and sdk/ sources and
      # release/, without node/tools and node/docs, which no release build
      # reads (only tests do). A change to any of them rebuilds; a change to the
      # host tools alone reuses the last build of the same sources.
      - name: Release cache key
        id: release-key
        run: |
          key=$(git ls-tree -r HEAD -- node sdk release | grep -vP '\tnode/(tools|docs)/' | sha256sum | cut -c1-64)
          echo "key=h4-release-$key" >> "$GITHUB_OUTPUT"
      # Restore and save separately: the combined action saves only when the
      # whole job succeeds, and H4 runs that fail later still built the set.
      - name: Cached release set
        id: release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release-later
          key: ${{ steps.release-key.outputs.key }}
      - name: Builder image
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: docker build --platform linux/amd64 -t dytallix-release-builder release/builder
      - name: Build the release set
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-work"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/release:/out" -v "$RUNNER_TEMP/release-work:/work" \
            dytallix-release-builder \
            python3 /src/release/build_release.py build --src /src --out /out --work /work
          # The upgrade drill's second release (T8): the application
          # recompiled from the same source, reusing this build's work tree.
          mkdir -p "$RUNNER_TEMP/release-later"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/release:/base:ro" \
            -v "$RUNNER_TEMP/release-later:/out" -v "$RUNNER_TEMP/release-work:/work" \
            dytallix-release-builder \
            python3 /src/release/build_release.py variant --src /src --base /base --out /out --work /work \
              --member consensus_stdio
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-later"
      - name: Save the release set
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release-later
          key: ${{ steps.release-key.outputs.key }}
      # Host setup v1's base setup: the packages, and ufw off (the node's table
      # is the host firewall). GitHub's runners ship with ufw active.
      - name: Host base setup
        # apt's 30 s network timeouts catch a stalled mirror (one held a job
        # for 85 minutes, 7 October 2026); this backstop lets a slow but
        # progressing mirror finish.
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y apparmor apparmor-utils nftables
          sudo ufw disable
          timedatectl show -p NTPSynchronized
          # The node's root helper refuses a group- or other-writable ancestor.
          # GitHub's image has /opt at 0777 (stock Ubuntu 24.04: 0755).
          stat -c '%U:%G %a %n' / /opt
          sudo chmod 0755 /opt
      # Not part of host setup: staging_host traces a failed start with it.
      - name: Diagnostic tools
        # apt's 30 s network timeouts catch a stalled mirror (one held a job
        # for 85 minutes, 7 October 2026); this backstop lets a slow but
        # progressing mirror finish.
        timeout-minutes: 20
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y strace bpftrace auditd
      # The rehearsal timing profile (launch/simulations/TIMINGS.json; P01,
      # 12 October 2026): R01 to R06's shortened timings.
      - name: Staging chain and bundles (rehearsal timings)
        run: |
          python3 node/tools/mainnet-preparation/staging_host.py prepare \
            --release "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/staging" --timings rehearsal
          python3 - "$RUNNER_TEMP/staging/chain" <<'PY'
          import json, sys
          from pathlib import Path
          chain = Path(sys.argv[1])
          summary = json.loads((chain / 'STAGING.json').read_text())
          assert summary['timings']['profile'] == 'rehearsal', summary['timings']
          genesis = json.loads((chain / 'chain' / 'genesis.json').read_text())
          evidence = genesis['consensus_params']['evidence']
          assert int(evidence['max_age_num_blocks']) == 2880 and evidence['max_age_duration'] == '14400000000000', evidence
          print(json.dumps(summary['timings'], indent=2))
          PY
      - name: Install, start and verify the validator
        id: install
        run: |
          sudo python3 node/tools/mainnet-preparation/staging_host.py install \
            --work "$RUNNER_TEMP/staging" --height 3 --timeout 300
      - name: Wipe
        if: ${{ always() && steps.install.conclusion != 'skipped' }}
        run: sudo python3 node/tools/mainnet-preparation/staging_host.py wipe --work "$RUNNER_TEMP/staging"

  # H4 for the two seats (P01, 11 October 2026): the validator on the
  # runner, and the sentry, the one public node that also serves the client
  # channel and the status page, in a KVM VM on a private bridge, each with
  # its own address on its own interface, each installed from its own bundle.
  # The sentry syncs from the validator; its status page answers; it
  # snapshots (a staging interval of 10 blocks) and its backup job uploads an
  # encrypted copy to a stand-in store inside its VM, which the runner opens
  # with the backup code.
  network:
    name: Staging network (H4 two seats)
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release cache key
        id: release-key
        run: |
          key=$(git ls-tree -r HEAD -- node sdk release | grep -vP '\tnode/(tools|docs)/' | sha256sum | cut -c1-64)
          echo "key=h4-release-$key" >> "$GITHUB_OUTPUT"
      # The install job built and saved this release set.
      - name: Cached release set
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release-later
          key: ${{ steps.release-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Host base setup
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y apparmor apparmor-utils nftables qemu-system-x86 qemu-utils genisoimage
          sudo ufw disable
          sudo chmod 0755 /opt
          ls -l /dev/kvm
      # Canonical's published image, checked against its SHA256SUMS and
      # cached by that digest.
      - name: Ubuntu 24.04 cloud image digest
        id: image
        run: |
          curl -fsSL --retry 3 https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS -o "$RUNNER_TEMP/SHA256SUMS"
          sum=$(grep ' \*ubuntu-24.04-server-cloudimg-amd64.img$' "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1)
          test -n "$sum"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
      - name: Cached cloud image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cloud.img
          key: ubuntu-cloud-${{ steps.image.outputs.sum }}
      - name: Download the cloud image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: curl -fSL --retry 3 https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img -o "$RUNNER_TEMP/cloud.img"
      - name: Check the cloud image
        run: echo "${{ steps.image.outputs.sum }}  $RUNNER_TEMP/cloud.img" | sha256sum -c
      - name: Save the cloud image
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cloud.img
          key: ubuntu-cloud-${{ steps.image.outputs.sum }}
      - name: Staging chain and bundles
        run: |
          python3 node/tools/mainnet-preparation/staging_network.py prepare \
            --release "$RUNNER_TEMP/release" --later-release "$RUNNER_TEMP/release-later" --work "$RUNNER_TEMP/network"
      - name: Bridge
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py network-up --work "$RUNNER_TEMP/network"
      - name: Sentry VM
        run: |
          sudo python3 node/tools/mainnet-preparation/staging_network.py vms-up \
            --work "$RUNNER_TEMP/network" --image "$RUNNER_TEMP/cloud.img"
      # The VM installs before the validator, whose firewall replaces the
      # runner's rules and with them the VM's route out.
      - name: Install the sentry
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py install-vms --work "$RUNNER_TEMP/network"
      - name: Install, start and verify the validator
        run: |
          sudo python3 node/tools/mainnet-preparation/staging_host.py install \
            --work "$RUNNER_TEMP/network/net" --height 3 --timeout 300
      - name: Network run (sync, status page, snapshot, backup)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py run --work "$RUNNER_TEMP/network"
      # The rehearsal wallets transact over the sentry's client channel: a
      # DRT transfer creating an account, a DGT transfer, a bond and a reward
      # claim, with the supply rule before and after (simulation plan, T1).
      - name: Wallet drill (T1)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py wallet-drill --work "$RUNNER_TEMP/network"
      # Both nodes' block and application hashes and supply at a common
      # height, every rehearsal account against the liquid totals, the burns
      # against the drill's ledger, and the sentry's database checked on a
      # stopped copy; anything but PASS fails (simulation plan, T6).
      - name: Reconciliation (T6)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py reconcile --work "$RUNNER_TEMP/network"
      # The load generator (simulation plan, T3): a fleet of fresh wallets
      # funded and first spent, then 1 transaction a second for 2 minutes in
      # the default mix (DRT and DGT sends, account creation, bond, unbond,
      # claim) signed offline at locally tracked nonces and sent in batches
      # through the release's gateway over the sentry's client channel, with
      # a governance proposal, deposit and vote beside it. Nothing lost, 99%
      # within 2 blocks, block intervals, supply and burns; evidence digest-
      # bound. One runner is one address: two channel connections.
      - name: Load generator (T3)
        timeout-minutes: 20
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py load --work "$RUNNER_TEMP/network"
      # T6 over the load: from its first status view against its ledger,
      # with every fleet account tracked.
      - name: Reconciliation after the load (T6)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py reconcile --after load --work "$RUNNER_TEMP/network"
      # The checkpoint recorder (simulation plan, T7): a short schedule of the
      # R07 checks CI can source, recorded against the fresh after-load
      # reconciliation and the load run and the client channel, each bound by
      # digest and re-verified. The record verifies to PASS, and the same
      # record is refused as the R07 dress rehearsal because its schedule is
      # not R07's.
      - name: Checkpoint recorder (T7)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py checkpoint --work "$RUNNER_TEMP/network"
      # The adversarial generator (simulation plan, T4) through the client
      # channel: an invalid ML-DSA-65 signature, a decode failure, a stale nonce
      # and an oversized request are each refused at admission, while a valid
      # control transaction is admitted and committed. After the checkpoint, so
      # its control commit does not disturb the after-load reconcile it binds.
      - name: Adversarial generator (T4)
        timeout-minutes: 15
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py adversary-drill --work "$RUNNER_TEMP/network"
      # The validator's host is lost and replaced by the fence-first
      # procedure (validator recovery F17; simulation plan, T9): the runner's
      # wipe.sh stands for the provider deleting it, the sentry's old votes
      # are set aside, the replacement block-syncs to H and signs from H + 1,
      # judged against the 8-hour objective. Before the restore drill, while
      # the sentry still holds every block from genesis.
      - name: Validator recovery drill (T9)
        timeout-minutes: 20
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py validator-recovery-drill --work "$RUNNER_TEMP/network"
      - name: Restore drill (disaster recovery R6)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py restore-drill --work "$RUNNER_TEMP/network"
      # Seat 5's kit replaced with the release's tools over the sentry's
      # client channel; after a staging-only notice of 20 blocks the old kit
      # is refused and the new kit freezes and resumes the chain (root kit
      # replacement K4; P01, 8 October 2026).
      - name: Kit replacement drill (K4)
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py kit-drill --work "$RUNNER_TEMP/network"
      # The sentry's monitor reports to a stand-in alerting service, with the
      # approved rules: a restart loop, a full disk, a halt (the validator
      # stopped) and a stopped monitor each alert and resolve (monitoring v1,
      # M5). The restart loop resolves only after its 15-minute window.
      - name: Monitoring drill (M5)
        timeout-minutes: 35
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py monitor-drill --work "$RUNNER_TEMP/network"
      # The fault injector (simulation plan, T5) on the sentry, through the
      # signed agent: latency and loss (tc netem), a p2p partition (a
      # self-expiring nftables table) and a process kill each take hold while
      # the validator keeps producing, and the sentry catches back up. It
      # records the recovery times; with no approved recovery target yet the
      # run is INCONCLUSIVE. It uninstalls the agent (not the node) so the
      # agent drill installs fresh. Runs after the monitor drill so its one
      # node restart cannot be read as the monitor's restart loop.
      - name: Fault injector (T5)
        timeout-minutes: 20
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py fault-drill --work "$RUNNER_TEMP/network"
      # The upgrade drill's second release staged beside the running one on
      # both hosts (T8), with the genesis release kept for the root (later
      # release start). Before the agent drill, whose wipe removes it.
      - name: Stage the later release (T8)
        timeout-minutes: 20
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py stage-later-release --work "$RUNNER_TEMP/network"
      # The staging agent (simulation plan, T2) on the sentry: signed status
      # and journal commands run; tampered, unsigned, replayed,
      # non-allowlisted and expired ones are refused; the results open with
      # the history code; and wipe.sh removes the agent with the node.
      - name: Staging agent drill (T2)
        timeout-minutes: 15
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py agent-drill --work "$RUNNER_TEMP/network"
      - name: Diagnostics
        if: failure()
        run: sudo python3 node/tools/mainnet-preparation/staging_network.py diagnostics --work "$RUNNER_TEMP/network"
