name: Mainnet release

# E06 (P01, 5 October 2026): two independent builds of the release set in the
# pinned builder, on separate runners, must give the same bytes. The founder's
# local container build (release/reproduce.sh) is the third.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'release/**'
      - '.github/workflows/mainnet-release.yml'
  pull_request:
    paths:
      - 'release/**'
      - '.github/workflows/mainnet-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release build ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Builder image
        run: docker build --platform linux/amd64 -t dytallix-release-builder release/builder
      - name: Build the release set
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/work"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/work:/work" \
            dytallix-release-builder \
            python3 /src/release/build_release.py build --src /src --out /out --work /work
      - name: Checksums
        run: cat "$RUNNER_TEMP/out/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.copy }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  compare:
    name: Builds are identical
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/builds
      - name: Compare
        run: |
          python3 release/build_release.py compare \
            "$RUNNER_TEMP/builds/release-a/SHA256SUMS" "$RUNNER_TEMP/builds/release-b/SHA256SUMS"
          cmp "$RUNNER_TEMP/builds/release-a/BUILD_RECORD.json" "$RUNNER_TEMP/builds/release-b/BUILD_RECORD.json"
          cmp "$RUNNER_TEMP/builds/release-a/SBOM.json" "$RUNNER_TEMP/builds/release-b/SBOM.json"
