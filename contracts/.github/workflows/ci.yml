name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Library tests
        run: cargo test --locked --all-targets
      - name: Ping example
        run: cargo test --locked --manifest-path examples/ping/Cargo.toml
      - name: Counter example
        run: cargo test --locked --manifest-path examples/counter/Cargo.toml
      - name: Reward splitter example
        run: cargo test --locked --manifest-path examples/reward_splitter/Cargo.toml
      - name: Algorithm guard example
        run: cargo test --locked --manifest-path examples/algorithm_guard/Cargo.toml

