# Edge compatibility routes used on dytallix.com.
# The backend service itself runs on port 3001 and exposes POST /api/faucet,
# POST /api/faucet/request, GET /api/status, GET /api/balance/:address, and GET /health.

location = /api/faucet/status {
    default_type application/json;
    return 200 '{"status":"operational","limits":{"dgt":10,"drt":100,"cooldownMinutes":1,"maxRequestsPerHour":20},"activeUsers":0}';
}

location ~ ^/api/faucet/check/[^/]+$ {
    default_type application/json;
    return 200 '{"canRequest":true,"timeUntilNext":0}';
}

location = /api/faucet/request {
    proxy_pass http://127.0.0.1:3001/api/faucet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

location = /api/faucet {
    proxy_pass http://127.0.0.1:3001/api/faucet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}